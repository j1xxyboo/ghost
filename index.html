<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Fighter">
<title>GHOST FIGHTER</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="crt"></div>
</div>

<!-- PSP-style touch overlay (only shown on touch devices) -->
<div id="touch" aria-hidden="true">
  <div id="topbar">
    <button class="tbtn" id="btn-pause" data-act="start">❚❚</button>
    <button class="tbtn" id="btn-full">⛶</button>
  </div>
  <div id="stick-zone">
    <div id="stick-base">
      <div class="arrow up"></div><div class="arrow down"></div>
      <div class="arrow left"></div><div class="arrow right"></div>
      <div id="stick-knob"></div>
    </div>
  </div>
  <button class="pbtn" id="b-super" data-act="super"><span class="lbl">SUPER</span></button>
  <div id="pad">
    <button class="pbtn" id="b-jump" data-act="jump"><span class="glyph tri">△</span><span class="lbl">JUMP</span></button>
    <button class="pbtn" id="b-punch" data-act="punch"><span class="glyph sq">□</span><span class="lbl">PUNCH</span></button>
    <button class="pbtn" id="b-special" data-act="special"><span class="glyph ci">○</span><span class="lbl">SPECIAL</span></button>
    <button class="pbtn" id="b-kick" data-act="kick"><span class="glyph cr">✕</span><span class="lbl">KICK</span></button>
  </div>
</div>

<!-- Portrait lock screen for phones -->
<div id="rotate">
  <div class="phone"><div class="screen"></div></div>
  <p>ROTATE YOUR PHONE</p>
  <small>Ghost Fighter plays in landscape</small>
</div>

<!-- iPhone Safari has no fullscreen API: explain Add to Home Screen instead -->
<div id="guide" role="dialog" aria-labelledby="guide-title">
  <div class="card">
    <h2 id="guide-title">PLAY FULL SCREEN</h2>
    <p class="why">iPhone Safari can't go full screen on websites.<br>Add the game to your home screen instead - it's free and takes 5 seconds:</p>
    <ol>
      <li><span class="n">1</span><span>Tap the <b>Share</b> button</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" /><path d="M8 10H5.5v10.5h13V10H16" /></svg></li>
      <li><span class="n">2</span><span>Choose <b>Add to Home Screen</b></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M12 8v8M8 12h8" /></svg></li>
      <li><span class="n">3</span><span>Open <b>Ghost Fighter</b> from your home screen</span>
        <img src="assets/apple-touch-icon.png" alt=""></li>
    </ol>
    <button id="guide-ok">GOT IT</button>
  </div>
</div>

<!-- online room-code entry (shown only on the JOIN screen) -->
<div id="netui">
  <label for="room-input">ENTER ROOM CODE</label>
  <input id="room-input" maxlength="5" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCDE" inputmode="text">
  <div class="row">
    <button id="room-join">JOIN</button>
    <button id="room-cancel">BACK</button>
  </div>
  <p id="room-error"></p>
</div>

<script src="js/vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/meta.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
